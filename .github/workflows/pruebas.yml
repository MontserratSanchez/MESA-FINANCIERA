# Pruebas automáticas en modo simulación: no usan llaves ni gastan cuota.
# Se ejecutan cada vez que subes cambios; si algo se rompe, verás una ❌ en la pestaña Actions.
name: pruebas

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MODO_SIMULACION: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: pytest -q
      - run: python analizar.py AAPL --simulacion
